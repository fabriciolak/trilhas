# Netlify: conecte o repositório e pronto (os headers também estão em apps/web/public/_headers).
[build]
  command = "corepack enable && pnpm install --frozen-lockfile && pnpm --filter @trilhas/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
