apiVersion: v1
kind: ConfigMap
metadata:
  name: carrinho-codigo
  namespace: carrinho
data:
  servidor.py: |
    """Carrinho da Pinguim Store (simulado para o DevOps Gym)."""
    import json
    import socket
    from http.server import BaseHTTPRequestHandler, HTTPServer

    class Carrinho(BaseHTTPRequestHandler):
        def do_GET(self):
            corpo = json.dumps({"servico": "carrinho", "itens": 3, "pod": socket.gethostname()}).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json")
            self.end_headers()
            self.wfile.write(corpo)

    print("carrinho: ouvindo na 8080", flush=True)
    HTTPServer(("0.0.0.0", 8080), Carrinho).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carrinho
  namespace: carrinho
spec:
  replicas: 2
  selector:
    matchLabels:
      app: carrinho
  template:
    metadata:
      labels:
        app: carrinho
    spec:
      containers:
        - name: carrinho
          image: python:3.14-alpine
          command: ["python", "-u", "/app/servidor.py"]
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: codigo
              mountPath: /app
      volumes:
        - name: codigo
          configMap:
            name: carrinho-codigo
---
apiVersion: v1
kind: Service
metadata:
  name: carrinho
  namespace: carrinho
spec:
  selector:
    app: carinho
  ports:
    - port: 80
      targetPort: 80
