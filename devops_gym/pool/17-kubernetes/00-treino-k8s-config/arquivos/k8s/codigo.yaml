# O programa do treino, entregue por um ConfigMap (não mexa neste arquivo).
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-codigo
  namespace: treino-config
data:
  app.py: |
    """App do treino de configuração no Kubernetes."""
    import json
    import os
    from http.server import BaseHTTPRequestHandler, HTTPServer


    class App(BaseHTTPRequestHandler):
        def do_GET(self):
            if self.path in ("/saude", "/pronto"):
                corpo = {"ok": True}
            else:
                try:
                    with open("/config/mensagem.txt", encoding="utf-8") as f:
                        mensagem = f.read().strip()
                except OSError:
                    mensagem = "(sem /config/mensagem.txt)"
                corpo = {"cor": os.environ.get("COR", "(sem COR)"), "mensagem": mensagem,
                         "senha_configurada": bool(os.environ.get("SENHA"))}
            dados = json.dumps(corpo, ensure_ascii=False).encode()
            self.send_response(200)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.end_headers()
            self.wfile.write(dados)

        def log_message(self, *args):
            pass


    print("app: ouvindo na 8080 (/saude, /pronto)", flush=True)
    HTTPServer(("0.0.0.0", 8080), App).serve_forever()
