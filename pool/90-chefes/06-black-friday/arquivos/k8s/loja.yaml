apiVersion: v1
kind: ConfigMap
metadata:
  name: loja-config
  namespace: blackfriday
data:
  DESCONTO: "10"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loja-codigo
  namespace: blackfriday
data:
  servidor.py: |
    """Loja da Pinguim na Black Friday (simulada para o DevOps Gym)."""
    import json
    import os
    import socket
    import threading
    import time
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    CACHE_MB = int(os.environ.get("CACHE_MB", "48"))
    DESCONTO = int(os.environ.get("DESCONTO", "0"))
    pronto = threading.Event()
    cache = bytearray()


    def aquecer():
        # O catálogo inteiro em memória: sem isso, a Black Friday derruba o banco.
        global cache
        print(f"loja: aquecendo o cache ({CACHE_MB} MB)...", flush=True)
        cache = bytearray(CACHE_MB * 1024 * 1024)
        for i in range(0, len(cache), 4096):
            cache[i] = 1  # encosta em cada página: a memória passa a ser usada de verdade
        time.sleep(5)
        pronto.set()
        print("loja: cache aquecido; pronta para vender", flush=True)


    class Loja(BaseHTTPRequestHandler):
        def responder(self, codigo, corpo):
            dados = json.dumps(corpo).encode()
            self.send_response(codigo)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(dados)))
            self.end_headers()
            self.wfile.write(dados)

        def do_GET(self):
            if self.path == "/saude":
                self.responder(200, {"status": "vivo"})
            elif self.path == "/pronto":
                self.responder(200 if pronto.is_set() else 503, {"pronto": pronto.is_set()})
            elif not pronto.is_set():
                self.responder(503, {"erro": "aquecendo o cache"})
            else:
                self.responder(200, {"loja": "pinguim", "desconto": DESCONTO, "pod": socket.gethostname()})

        def log_message(self, formato, *args):
            pass


    print("loja: ouvindo na 8080 (/saude: vivo; /pronto: pronto para receber tráfego)", flush=True)
    threading.Thread(target=aquecer, daemon=True).start()
    ThreadingHTTPServer(("0.0.0.0", 8080), Loja).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loja
  namespace: blackfriday
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loja
  template:
    metadata:
      labels:
        app: loja
    spec:
      containers:
        - name: loja
          image: python:3.14-alpine
          command: ["python", "-u", "/app/servidor.py"]
          ports:
            - containerPort: 8080
          env:
            - name: CACHE_MB
              value: "48"
            - name: DESCONTO
              valueFrom:
                configMapKeyRef:
                  name: loja-config
                  key: DESCONTO
          resources:
            limits:
              memory: 32Mi
          volumeMounts:
            - name: codigo
              mountPath: /app
      volumes:
        - name: codigo
          configMap:
            name: loja-codigo
---
apiVersion: v1
kind: Service
metadata:
  name: loja
  namespace: blackfriday
spec:
  selector:
    app: loja
  ports:
    - port: 80
      targetPort: 8080
