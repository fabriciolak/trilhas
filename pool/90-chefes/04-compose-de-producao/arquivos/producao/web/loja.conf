server {
    listen 80;

    location / {
        default_type text/html;
        return 200 '<!doctype html><meta charset="utf-8"><title>Pinguim Store</title><h1>Pinguim Store</h1><p>Produção no ar.</p>\n';
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }
}
